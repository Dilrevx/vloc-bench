[project]
name = "vulnerability-localization-benchmark"
version = "0.1.0"
description = "Vulnerability Localization Benchmark: Two-phase vulnerability localization eval harness"
license = "Apache-2.0"
authors = [{ name = "Cisco Foundation AI" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "openai>=2.0",
    "vllm>=0.19",
    "transformers>=5.0",
    "torch>=2.0",
]

[project.scripts]
vulnerability-localization-benchmark = "vulnerability_localization_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnerability_localization_benchmark"]
